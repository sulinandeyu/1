<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小苏相机摄影候选离线盲测</title>
  <style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0b0c;color:#f5f5f5}body{max-width:1500px;margin:auto;padding:24px}.inputs,.reasons,.actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}label{background:#18181b;border:1px solid #333;border-radius:10px;padding:10px}input,select,textarea{margin-left:6px}.original{max-width:420px;max-height:300px;object-fit:contain;background:#111}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#151518;border-radius:14px;padding:12px}.card img{width:100%;height:65vh;object-fit:contain;background:#090909}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#fff;color:#111}.muted{background:#333;color:#fff}#status{color:#a7f3d0;white-space:pre-wrap}@media(max-width:800px){.pair{grid-template-columns:1fr}.card img{height:50vh}}</style>
</head>
<body>
  <h1>小苏相机摄影候选离线盲测</h1>
  <p>两张候选随机排列，投票前不显示身份。技术质检、摄影目标合理性和最终人工偏好分别记录；本工具不会上传图片。</p>
  <div class="inputs">
    <label>案例 ID <input id="caseId" value="phone-owned-001"></label><label>构建号 <input id="build"></label><label>评价者 <input id="reviewer"></label>
    <label>A 原图 <input id="original" type="file" accept="image/*"></label><label>候选 X 标识 <input id="candidateXId" value="B"></label><label>候选 X 图片 <input id="candidateX" type="file" accept="image/*"></label>
    <label>候选 Y 标识 <input id="candidateYId" value="D"></label><label>候选 Y 图片 <input id="candidateY" type="file" accept="image/*"></label>
    <label>X 技术状态 <select id="technicalX"><option>passed</option><option>warning</option><option>failed</option><option>unknown</option></select></label><label>Y 技术状态 <select id="technicalY"><option>passed</option><option>warning</option><option>failed</option><option>unknown</option></select></label>
  </div>
  <h2>A 原图（只作内容对照）</h2><img class="original" id="originalPreview" alt="请加载原图">
  <div class="pair"><section class="card"><h2>左图</h2><img id="left" alt="请加载候选"></section><section class="card"><h2>右图</h2><img id="right" alt="请加载候选"></section></div>
  <h2>异常原因（可多选）</h2><div class="reasons" id="reasons"></div>
  <div class="inputs"><label>摄影目标判断 <select id="targetAssessment"><option value="not_evaluated">未评价</option><option value="reasonable">合理</option><option value="unreasonable">不合理</option><option value="uncertain">不确定</option></select></label><label>备注 <textarea id="notes" rows="3" cols="70"></textarea></label></div>
  <div class="actions"><button class="primary" data-choice="left_better">左图更好</button><button class="primary" data-choice="right_better">右图更好</button><button class="muted" data-choice="both_bad">两者都不好</button><button class="muted" data-choice="difference_not_obvious">差异不明显</button><button class="muted" id="export" type="button">导出全部评价 JSON</button><button class="muted" id="reset" type="button">清空本地评价</button></div><p id="status"></p>
<script>
const reasonLabels={skin_tone_abnormal:'肤色异常',neutral_color_damage:'中性色损伤',color_cast:'偏色',oversharpened:'过度锐化',haze:'灰雾',oversaturated:'过饱和',local_edit_error:'局部处理错误',highlight_damage:'高光破坏',shadow_damage:'暗部破坏',halo:'光晕',weak_expression:'摄影表达过弱',other:'其他'};
const $=id=>document.getElementById(id),state={left:'',right:'',files:{original:'',candidateX:'',candidateY:''}};Object.entries(reasonLabels).forEach(([id,label])=>{const el=document.createElement('label');el.innerHTML=`<input type="checkbox" value="${id}"> ${label}`;$('reasons').appendChild(el)});
$('original').addEventListener('change',()=>{const f=$('original').files[0];if(!f)return;state.files.original=f.name;$('originalPreview').src=URL.createObjectURL(f)});
function arrange(){const x=$('candidateX').files[0],y=$('candidateY').files[0],xid=$('candidateXId').value.trim(),yid=$('candidateYId').value.trim();if(!x||!y||!xid||!yid)return;state.files.candidateX=x.name;state.files.candidateY=y.name;const swap=crypto.getRandomValues(new Uint8Array(1))[0]%2===0;state.left=swap?yid:xid;state.right=swap?xid:yid;$('left').src=URL.createObjectURL(swap?y:x);$('right').src=URL.createObjectURL(swap?x:y);$('status').textContent='候选已随机排列；请先观察，再记录人工偏好。'}
['candidateX','candidateY','candidateXId','candidateYId'].forEach(id=>$(id).addEventListener('change',arrange));function records(){return JSON.parse(localStorage.getItem('xiaosu-photo-preferences-v2')||'[]')}
document.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>{if(!state.files.original||!state.files.candidateX||!state.files.candidateY){$('status').textContent='请先加载原图和两张真实候选。';return}const x=$('candidateXId').value.trim(),y=$('candidateYId').value.trim();const entry={schemaVersion:2,caseId:$('caseId').value.trim(),recordedAt:new Date().toISOString(),choice:btn.dataset.choice,blindAssignment:{left:state.left,right:state.right},candidateIds:{x,y},technicalQuality:{[x]:$('technicalX').value,[y]:$('technicalY').value},targetAssessment:$('targetAssessment').value,humanPreferenceStatus:btn.dataset.choice==='difference_not_obvious'?'inconclusive':'evaluated',reasons:[...document.querySelectorAll('#reasons input:checked')].map(e=>e.value),files:{...state.files},notes:$('notes').value.trim(),reviewer:$('reviewer').value.trim(),iphoneBuild:$('build').value.trim(),source:'human_offline_blind_comparison'};const all=records();all.push(entry);localStorage.setItem('xiaosu-photo-preferences-v2',JSON.stringify(all));$('status').textContent=`已记录第 ${all.length} 条。揭盲：左=${state.left}，右=${state.right}。技术状态不会替代人工偏好。`;arrange()}));
$('export').onclick=()=>{const data=JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),results:records()},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`xiaosu-preferences-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;a.click()};$('reset').onclick=()=>{if(confirm('确定清空浏览器中的全部本地评价？')){localStorage.removeItem('xiaosu-photo-preferences-v2');$('status').textContent='已清空。'}};
</script></body></html>
