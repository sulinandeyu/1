name: iOS Build

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve build settings
        run: |
          xcodebuild \
            -project MasterCamera.xcodeproj \
            -scheme MasterCamera \
            -showBuildSettings

      - name: Test scene-adaptive decision contracts
        run: swift test

      - name: Run app-hosted Core Image pixel tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime in d["devices"].values() for x in runtime if x.get("isAvailable") and "iPhone" in x.get("name", "")))')
          xcodebuild test \
            -project MasterCamera.xcodeproj \
            -scheme MasterCamera \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project MasterCamera.xcodeproj \
            -scheme MasterCamera \
            -configuration Debug \
            -sdk iphonesimulator \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO

